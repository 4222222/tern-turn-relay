[package]
name = "tern-turn-rust-prototype"
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[dependencies]
async-trait = "0.1"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.4"
turn = "=0.17.2"
tokio-util = { version = "0.7", features = ["rt"] }
stun = "=0.17.0"
util = { package = "webrtc-util", version = "=0.17.1", default-features = false, features = ["conn", "vnet"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
