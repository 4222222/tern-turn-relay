name: Rust prototype build
on:
  push:
    branches: [rust-turn-prototype]
    paths:
      - 'experiments/rust-prototype/**'
      - '.github/workflows/rust-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: experiments/rust-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build locked experimental binary
        run: cargo build --release --locked
      - name: Smoke standalone executable
        run: |
          ./target/release/tern-turn-rust-prototype --help
          shasum -a 256 target/release/tern-turn-rust-prototype
          file target/release/tern-turn-rust-prototype
      - uses: actions/upload-artifact@v4
        with:
          name: rust-prototype-macos-arm64
          path: experiments/rust-prototype/target/release/tern-turn-rust-prototype
          retention-days: 7
