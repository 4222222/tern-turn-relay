name: Verify release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-latest
            python: '3.12'
          - os: macos-15-intel
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Package allowlisted release
        run: python package_release.py --output-dir dist
      - name: Smoke pinned standalone runtime
        if: runner.os == 'macOS'
        run: |
          /bin/sh bootstrap-runtime.sh "$RUNNER_TEMP/tern-turn-runtime" --prepare
          "$RUNNER_TEMP/tern-turn-runtime/managed-python/python/bin/python3" -I -B -c 'import ssl, sys; assert sys.version_info[:3] == (3, 13, 9); print(sys.version); print(ssl.OPENSSL_VERSION)'
          "$RUNNER_TEMP/tern-turn-runtime/managed-python/python/bin/python3" -E -s -B -m unittest discover -s tests -v
