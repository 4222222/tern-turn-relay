name: Verify native release
on:
  push:
    branches: [main, rust-native-release]
    paths: ['native/**', '.github/workflows/verify.yml', 'tools/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: tern-turn-relay-darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: tern-turn-relay-darwin-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: tern-turn-relay-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: tern-turn-relay-linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_BACKTRACE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux static toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Resource snapshot
        run: df -h . && (free -m || sysctl vm.swapusage)
      - name: Behavioral tests
        run: cargo test --locked --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - name: Smoke actual binary
        run: |
          native/target/${{ matrix.target }}/release/tern-turn-relay --version
          native/target/${{ matrix.target }}/release/tern-turn-relay --help
          python3 tools/release.py smoke native/target/${{ matrix.target }}/release/tern-turn-relay
      - name: Collect artifact and licenses
        run: |
          mkdir -p artifact
          cp native/target/${{ matrix.target }}/release/tern-turn-relay artifact/${{ matrix.asset }}
          python3 tools/release.py notices artifact/THIRD_PARTY_NOTICES.txt --target ${{ matrix.target }}
          shasum -a 256 artifact/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifact/
          retention-days: 7
